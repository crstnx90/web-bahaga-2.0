    <body id="page-top">
        <!-- Navegación-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top py-3 mb-5" id="mainNav" style="margin-bottom: 40px;">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="index.html#page-top">Eventos Bahaga</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto my-2 my-lg-0">

                        <li class="nav-item"><a class="nav-link" href="index.html#services">Servicios</a></li>

                    </ul>
                </div>
            </div>
        </nav>

        <!-- Contenido principal -->
        <div class="container mt-5 pt-5"> <!-- Aquí se agrega un margen superior para separar del navbar -->
            <h2>Mis Reservaciones</h2>
            <table class="table table-bordered" id="reservacionesTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll" /></th>
                        <th>Fecha Evento</th>
                        <th>Hora</th>
                        <th>Tipo de Evento</th>
                        <th>Salón</th>
                        <th>Capacidad</th>
                        <th>Cantidad Personas</th>
                        <th>Observaciones</th>
                    </tr>
                </thead>
                <tbody id="reservacionesTableBody">
                    <!-- Las filas de las reservaciones serán insertadas aquí mediante JavaScript -->
                </tbody>
            </table>

            <!-- Botones de acción (Editar y Eliminar) -->
            <div class="action-buttons mt-3">
                <button id="editarButton" class="btn btn-warning" disabled>Editar</button>
                <button id="eliminarButton" class="btn btn-danger" disabled>Eliminar</button>
            </div>
        </div>

        <!-- Footer-->
        <footer class="bg-light py-5">
            <div class="container px-4 px-lg-5">
                <div class="small text-center text-muted">Copyright &copy; 2024 - Bahaga Eventos</div>
